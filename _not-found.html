\"label\":\"Idea → production\",\"text\":\"your idea in the hands of real users in one to two months, built the way it will be maintained rather than as a demo to throw away.\"},{\"label\":\"Architecture and foundations\",\"text\":\"the system drawn and the foundation stood up — framework and platform chosen, the structure and its conventions in place — for a team that will build the features itself.\"},{\"label\":\"Your team on agent rails\",\"text\":\"the architecture, the staged pipeline and the pre-push gate that let a crowd of agents ship without drifting — set up on your codebase, then handed over as checked-in procedure rather than as advice. It has been handed over once already, and the engineers who took it carried it to projects of their own.\"},{\"label\":\"Rescue and diagnosis\",\"text\":\"the prototype that got vibe-coded into a corner, and the agent that doesn't do what you expected — usually the same purchase.\"},{\"label\":\"Standing technical judgment\",\"text\":\"build-vs-buy calls, and a straight answer on what the models still cannot do.\"}]},\"engineeringSystem\":{\"title\":\"The Engineering System\",\"items\":[\"Feature-sliced architecture held by linters, so a crowd of agents working at once cannot drift the structure.\",\"A staged pipeline — plan, implement, review, finalize — each stage its own session, with reviewable artifacts between them.\",\"Branch hygiene held in-session: a gate of concurrent checks before every push, the production build among them, so no agent contaminates main with code that breaks it.\",\"CI/CD that fits your workflow — ship every commit off main, staging-based release cycles, or release trains.\"]},\"workingStyle\":{\"title\":\"Working Style\",\"paragraphs\":[\"I'm the kind of developer you can generally leave unattended, as long as the overall vector is clear. I have enough life expertise to figure stuff on my own, enough imagination to fill the missing pieces, and a \\\"treat any job as if it was your own brainchild\\\" mentality.\",\"In other words: a surprisingly low-maintenance LLM tinkerer with a TypeScript kink, ready to prototype, debug, or sanity-check your AI-infused ambitions.\"]},\"aiExpertise\":{\"title\":\"AI Expertise\",\"paragraphs\":[\"I tend to stick to a more \\\"economical\\\" paradigm of AI usage: smaller prompts, more aware of context limitations, less \\\"let's feed it all and it'll somehow work!\\\" My expertise predates the ChatGPT hype cycle, which means I understand not just the APIs, but the underlying patterns and limitations that most \\\"AI engineers\\\" are still discovering.\"]}}},\"experience\":{\"title\":\"Experience\",\"playgram\":{\"title\":\"Fractional CTO\",\"period\":\"Playgram (March – August 2026)\",\"description\":\"Rebuilt a live, feature-rich AI chat product — multiple model providers, realtime team chats, image and file libraries, memory and knowledge management, voice input — from Bubble, a no-code builder, into a production Next.js 16 codebase, while it stayed in production for its users throughout.\",\"intro\":\"Delivered in 158 days — parallel AI sessions, up to 20 agents working at once:\",\"items\":[{\"lead\":\"1,395 commits on main\",\"text\":\"and 250,000 lines of production TypeScript, none of it hand-written.\"},{\"label\":\"48 releases and 18 hotfixes\",\"text\":\"a production deploy every 2.4 days.\"},{\"lead\":\"Sub-second cold loads,\",\"text\":\"down from multi-second.\"},{\"lead\":\"Feature-sliced architecture held by linters,\",\"text\":\"so a crowd of agents working at once could not drift the structure.\"},{\"label\":\"A repeatable agent pipeline\",\"text\":\"plan, implement, review, finalize — each stage its own session, with a reviewable artifact between them.\"}]},\"englishForKids\":{\"title\":\"Senior Fullstack Developer\",\"period\":\"October 2025 – February 2026\",\"description\":\"AI-powered English learning application for kids, combining generative AI with time-tested pedagogical methodology to make language acquisition engaging and effective.\",\"items\":[\"Interactive game-based learning experiences powered by LLM-generated content.\",\"Adaptive difficulty and personalized learning paths based on individual progress.\",\"Integration of proven teaching methods with modern AI capabilities.\"]},\"orcool\":{\"title\":\"Senior Fullstack Developer\",\"period\":\"Orcool (June – August 2025)\",\"description\":\"Short-term project shaping an AI-agent–based review intelligence tool for brand marketing.\",\"intro\":\"Built the system end-to-end, covering:\",\"items\":[\"Automated review collection from diverse public sources.\",\"AI-driven summarization with structured outputs (SWOT, competitive positioning, feature insights).\",\"Early productization steps toward a scalable SaaS-style platform.\"]},\"randddb\":{\"title\":\"Fullstack Developer\",\"period\":\"randddb.com / DDB (2023 – 2025)\",\"description\":\"Experimental AI platform at one of the world's largest ad firms. Built, back to front, a suite of interlinked AI tools:\",\"items\":[{\"label\":\"Chatbot\",\"text\":\"ChatGPT-style assistant for corporate needs — secure, document-aware, image-savvy, with personas and real-time multi-user support.\"},{\"label\":\"Robowriter\",\"text\":\"Build-your-own-agent tool for content generation. Functions as both user-facing product and meta-backend for LLM ops.\"},{\"label\":\"Picmaker\",\"text\":\"Replicate-powered image generation/training tool with UX optimized for rapid iteration and intuitive pinning.\"},{\"label\":\"Client-specific apps\",\"text\":\"Including YesYouCannes, which builds Cannes award decks from idea to imagery in minutes.\"},{\"label\":\"Spaces\",\"text\":\"White-label mini-platforms for agency clients (e.g. randddb.com/s/ikea).\"}],\"demo\":\"Demo available on request.\"},\"independent\":{\"title\":\"Developer – Independent Projects\",\"period\":\"2020 – Present\",\"intro\":\"Selected highlights:\",\"items\":[{\"label\":\"Jukebox Web UI\",\"text\":\"Gradio-based UI running inside Google Colab for OpenAI's music model.\"},{\"label\":\"almostmagic\",\"text\":\"TypeScript package for instant LLM integration – one line, zero ceremony.\"},{\"label\":\"JobGenie\",\"text\":\"AI assistant for job seekers that helps create roles as much as apply for them.\"},{\"label\":\"Flows\",\"text\":\"A Django app for orchestrating async task pipelines with minimal ceremony.\"},{\"label\":\"Unfindables\",\"text\":\"An experiment in surfacing valuable but hidden web content via absurd search queries.\"}]},\"voicemod\":{\"title\":\"Prototyper – Experience \u0026 Innovation\",\"period\":\"Voicemod (2023)\",\"description\":\"Prototyped bleeding-edge tools for audio + AI experimentation.\",\"items\":[\"Built a YAML-powered Discord bot framework for zero-code bot creation.\",\"Developed a local Python web API with a ChatGPT-style interface.\"]}},\"caseStudies\":{\"playgram\":{\"link\":\"Read the case study\"}},\"techStack\":{\"title\":\"Tech Stack\",\"backend\":{\"title\":\"Backend\",\"items\":[{\"lead\":\"Django / FastAPI\",\"text\":\"– If you rely on your own ML models or otherwise require computations/libs that the JavaScript world hasn't yet caught up with\"},{\"lead\":\"Next.js API\",\"text\":\"– If you're mostly using other people's web APIs and don't want to go all fancy and domain-driven\"},{\"lead\":\"NestJS\",\"text\":\"– If you do want to go all fancy and domain-driven\"}]},\"frontend\":{\"title\":\"Frontend\",\"items\":[{\"lead\":\"Next.js / React\",\"text\":\"– If you want to stay on the safe and \\\"we can definitely hire another dev to work with it later\\\" side\"},{\"lead\":\"Nuxt / Vue\",\"text\":\"– If you're feeling all progressive and SFC-ish\"}]},\"serverless\":{\"title\":\"Serverless / Other\",\"items\":[{\"lead\":\"Cloudflare Workers\",\"text\":\"– Because why not rely on something that can make the entire Internet stop a few times a year?\"},{\"lead\":\"Google Colab\",\"text\":\"— Had my fair share of fails and successes building and testing models\"},{\"lead\":\"Gradio\",\"text\":\"– Quick but powerful UIs for ML experiments\"}]}},\"education\":{\"title\":\"Education\",\"school\":\"Moscow Institute of Physics and Technology\",\"degree\":\"Master's in Applied Math \u0026 Physics (2000 – 2006)\"},\"contact\":{\"title\":\"Contact\",\"github\":\"github.com/vzakharov\",\"linkedin\":\"linkedin.com/in/vovahimself\",\"x\":\"x.com/vovahimself\"},\"footer\":{\"backLink\":\"← Back to main page\",\"printFooter\":\"Full portfolio:\"},\"variants\":{\"cto\":{\"metadata\":{\"description\":\"Fractional, hands-on CTO for AI-native delivery: agent orchestration, guardrails, and a pipeline that shipped 250,000 lines of production TypeScript in 158 days.\",\"ogSuffix\":\"The platform outlived my involvement — the engineers who took it over run it today.\"},\"header\":{\"tagline\":\"Fractional, hands-on CTO for AI-native delivery\"},\"profile\":{\"paragraph1\":\"158 days, \u003cstrong\u003e250,000 lines of production TypeScript\u003c/strong\u003e, none of it hand-written, up to \u003cstrong\u003e20 agents working at once\u003c/strong\u003e, and \u003cstrong\u003ea production deploy every 2.4 days\u003c/strong\u003e — on a live product that stayed in production for its users the whole way through. The engineering platform I built to get there outlived my involvement: three engineers run it today, and it travels to their new projects as a checked-in boilerplate.\",\"paragraph2\":\"Most of my work has revolved around LLMs and image generation ever since 2020, following years of messing with smaller neural networks. This means I \u003cstrong\u003edon't buy or sell buzzwords\u003c/strong\u003e, I understand things \u003cstrong\u003ea level or two deeper than most\u003c/strong\u003e, and I've developed an \u003cstrong\u003eintuition for what models can and cannot do\u003c/strong\u003e. What I'm not is a compliance function or a headcount manager: this is founder-and-small-team scale, where I run the delivery rather than the org chart.\"}}}},\"ui\":{\"toggleTheme\":\"Toggle theme\",\"cvVariants\":{\"cto\":\"Looking for a CTO?\",\"dev\":\"Looking for a dev?\"}}},\"now\":\"$undefined\",\"timeZone\":\"UTC\",\"children\":\"$Lf\"}]\n"])</script><script>self.__next_f.push([1,"10:I[8795,[\"/_next/static/chunks/cd480578a47420d3.js\",\"/_next/static/chunks/398504abcb01b8fc.js\",\"/_next/static/chunks/d309dc137805cc68.js\",\"/_next/static/chunks/f5f20ef3f66fbcf1.js\"],\"ThemeProvider\"]\n11:I[30381,[\"/_next/static/chunks/cd480578a47420d3.js\",\"/_next/static/chunks/398504abcb01b8fc.js\",\"/_next/static/chunks/d309dc137805cc68.js\",\"/_next/static/chunks/f5f20ef3f66fbcf1.js\"],\"ThemeToggle\"]\n"])</script><script>self.__next_f.push([1,"f:[\"$\",\"$L10\",null,{\"children\":[[\"$\",\"div\",null,{\"className\":\"theme-corner-module-scss-module__0my3Wa__corner\",\"children\":[\"$\",\"$L11\",null,{}]}],[\"$\",\"$L4\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorScripts\":\"$undefined\",\"template\":[\"$\",\"$L5\",null,{}],\"templateStyles\":\"$undefined\",\"templateScripts\":\"$undefined\",\"notFound\":[[[\"$\",\"title\",null,{\"children\":\"404: This page could not be found.\"}],[\"$\",\"div\",null,{\"style\":\"$0:f:0:1:1:children:1:children:0:props:children:0:1:props:style\",\"children\":[\"$\",\"div\",null,{\"children\":[[\"$\",\"style\",null,{\"dangerouslySetInnerHTML\":{\"__html\":\"body{color:#000;background:#fff;margin:0}.next-error-h1{border-right:1px solid rgba(0,0,0,.3)}@media (prefers-color-scheme:dark){body{color:#fff;background:#000}.next-error-h1{border-right:1px solid rgba(255,255,255,.3)}}\"}}],[\"$\",\"h1\",null,{\"className\":\"next-error-h1\",\"style\":\"$0:f:0:1:1:children:1:children:0:props:children:0:1:props:children:props:children:1:props:style\",\"children\":404}],[\"$\",\"div\",null,{\"style\":\"$0:f:0:1:1:children:1:children:0:props:children:0:1:props:children:props:children:2:props:style\",\"chil
